[package]
name = "stray-cat"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A small cat that lives in your terminal."

[[bin]]
name = "stray"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"
